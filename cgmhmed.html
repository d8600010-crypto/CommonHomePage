:root {
    --bg-1: #eef2ff; --bg-2: #f7f9fc; --bg-3: #e0f2fe;

}
* { box-sizing: border-box; }
body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;

header { padding: 30px 20px 15px; text-align: center; }
.logo {
    width: 64px; height: 64px; margin: auto; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--brand-dark), var(--brand));
    color: white; font-size: 28px; font-weight: 800; box-shadow: var(--shadow-md);
}
h1 { margin: 12px 0 4px; font-size: 26px; font-weight: 800; }
.subtitle { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 15px; }
/* Navigation */
.tabs-nav-container { max-width: 1180px; margin: 0 auto 15px; padding: 0 20px; }
.tabs-nav { display: flex; gap: 8px; overflow-x: auto; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.tab-btn {
    padding: 10px 18px; border: 1px solid transparent; border-bottom: none;
    border-radius: 12px 12px 0 0; background: rgba(255, 255, 255, 0.6);
    color: var(--ink-soft); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap;
}
.tab-btn:hover { background: #fff; color: var(--brand); }
.tab-btn.active { background: #fff; color: var(--brand); border-color: var(--line); border-bottom: 3px solid var(--brand); }
/* Controls */
.toolbar { max-width: 1180px; margin: 0 auto 20px; padding: 0 20px; display: flex; gap: 10px; flex-wrap: wrap; }
.search-box {
    flex: 1; min-width: 240px; padding: 12px 18px; border: 1px solid var(--line); border-radius: 12px;
    outline: none; background: var(--surface); font-size: 14.5px; box-shadow: var(--shadow-sm);
}
.btn {
    padding: 12px 18px; border: none; border-radius: 12px; background: var(--brand);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.btn:hover { opacity: 0.9; }
.btn-secondary { background: #64748b; }
main { max-width: 1180px; margin: 0 auto 60px; padding: 0 20px; box-sizing: border-box; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); grid-auto-flow: dense; gap: 16px; min-height: 80px; }
/* Cards */
.card {
    position: relative; display: flex; flex-direction: column; padding: 18px;
    border-radius: var(--radius-md); text-decoration: none; color: inherit; background: var(--surface);
    border: 1px solid var(--surface-border); box-shadow: var(--shadow-sm); transition: transform 0.15s, box-shadow 0.15s;
    cursor: grab;
}
.card:active { cursor: grabbing; }
.card.dragging { opacity: 0.4; transform: scale(0.98); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
.icon {
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: #ccfbf1; color: var(--brand); font-size: 16px; font-weight: 800; flex-shrink: 0;
}
.card-actions { display: flex; gap: 4px; flex-shrink: 0; }
.action-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--ink-faint); padding: 2px 6px; border-radius: 6px; }
.action-btn:hover { background: #e2e8f0; color: var(--ink); }
.card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; word-break: break-word; overflow-wrap: anywhere; }
.card p { margin: 0; color: var(--ink-soft); font-size: 12.5px; line-height: 1.5; word-break: break-word; overflow-wrap: anywhere; }
.card-meta { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.account-badge { font-size: 11px; background: #f1f5f9; padding: 3px 8px; border-radius: 6px; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
.card-link { font-size: 12px; font-weight: 700; color: var(--brand); text-decoration: none; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
/* Login-style cards (migrated from B: Hinet / CGU Mail / UpToDate / EmyWay) */
.card.card-wide { grid-column: span 2; }
@media (max-width: 520px) { .card.card-wide { grid-column: span 1; } }
.login-info { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 10px; }
.login-info label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.login-info input[type="text"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-family: inherit; outline: none; background: #fff; color: var(--ink);
}
.login-info input[type="text"]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(13,148,136,0.14); }
.account-row { display: flex; justify-content: space-between; align-items: center; background: #f6f8fb; padding: 9px 12px; border-radius: 9px; font-size: 13px; gap: 8px; }
.account-row strong { font-weight: 700; word-break: break-all; }
.account-row button { padding: 5px 10px; border: none; border-radius: 7px; cursor: pointer; background: #e9edf3; font-size: 12px; line-height: 1; flex-shrink: 0; }
.account-row button:hover { background: #dde3ec; }
.emy-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
    padding: 11px; background: var(--brand); color: #fff; text-decoration: none; border-radius: 10px;
    font-weight: 700; font-size: 13.5px;
}
.emy-btn:hover { opacity: 0.9; }

.ws-intro { color: var(--ink-soft); font-size: 13px; line-height: 1.7; margin: 4px 0 16px; }
.ws-field { margin-bottom: 14px; }
.ws-field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.ws-field input, .ws-field textarea {

.ws-field input:focus, .ws-field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(13,148,136,0.14); }
.ws-field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.ws-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.ws-buttons button { border: none; border-radius: 10px; padding: 11px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
.ws-save { background: var(--brand); color: #fff; }
.ws-save:hover { opacity: 0.9; }
.ws-clear { background: #eef1f6; color: var(--ink); }
.ws-clear:hover { background: #e3e8f0; }
.ws-search-row { margin: 22px 0 14px; }
.ws-records { display: grid; gap: 12px; }
.ws-record { background: #f8fafc; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.ws-record-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ws-filename { font-size: 15px; font-weight: 700; color: var(--ink); word-break: break-word; }
.ws-date { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
.ws-record-content {
    margin-top: 10px; white-space: pre-wrap; line-height: 1.7; font-size: 13px; color: var(--ink-soft);
    background: #fff; border: 1px solid var(--line); padding: 12px 14px; border-radius: 10px; overflow-wrap: anywhere;

.ws-delete { background: #fee2e2; color: #b91c1c; border: none; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
.ws-delete:hover { background: #fecaca; }
.ws-empty { text-align: center; padding: 30px; color: var(--ink-faint); font-size: 13px; }
footer { text-align: center; padding: 25px; color: var(--ink-faint); font-size: 12.5px; border-top: 1px solid var(--line); }
</style>
</head>

/* ==========================================================
   Rendering — branches by card.type but keeps every card
   inside A's single draggable #cardGrid container.
========================================================== */
function renderCards() {
    const grid = document.getElementById("cardGrid");
    grid.innerHTML = "";
    cards.forEach((card, index) => {
        const el = document.createElement("div");
        el.className = "card" + (card.type === "login" || card.type === "emy" ? " card-wide" : "") + (card.type === "workspace" ? " card-workspace" : "");
        el.draggable = true;
        el.dataset.index = index;
        if (card.type === "login") {
            el.innerHTML = renderLoginCard(card);
        } else if (card.type === "emy") {
            el.innerHTML = renderEmyCard(card);
        } else if (card.type === "workspace") {
            el.innerHTML = renderWorkspaceCard(card);
        } else {
            el.innerHTML = renderLinkCard(card);
        }
        el.addEventListener("dragstart", handleDragStart);
        el.addEventListener("dragover", handleDragOver);
        el.addEventListener("drop", handleDrop);
        el.addEventListener("dragend", handleDragEnd);
        grid.appendChild(el);
    });
    // Post-render wiring for special card types
    const wsCard = cards.find(c => c.type === "workspace");
    if (wsCard) {
        const searchInput = document.getElementById("wsSearch");
        if (searchInput) searchInput.addEventListener("input", wsRenderRecords);
        wsDisplayRecords();
    }
}
function renderLinkCard(card) {
    return `
        <div class="card-header">
            <div class="icon">${card.icon || '🩺'}</div>
            <div class="card-actions">
                <button class="action-btn" onclick="editCard('${card.id}')" title="編輯">✏️</button>
                <button class="action-btn" onclick="deleteCard('${card.id}')" title="刪除">🗑️</button>
            </div>
        </div>
        <h3>${escapeHtml(card.title)}</h3>
        <p>${escapeHtml(card.desc)}</p>
        <div class="card-meta">
            <span class="account-badge">${escapeHtml(card.meta || '醫療')}</span>
            <a href="${escapeHtml(card.url)}" target="_blank" rel="noopener noreferrer" class="card-link" onclick="event.stopPropagation()">開啟 ↗</a>
        </div>
    `;
}
function renderLoginCard(card) {
    return `
        <div class="card-header">
            <div class="icon">${card.icon || '🩺'}</div>
            <div class="card-actions">
                <button class="action-btn" onclick="editCard('${card.id}')" title="編輯">✏️</button>
                <button class="action-btn" onclick="deleteCard('${card.id}')" title="刪除">🗑️</button>
            </div>
        </div>
        <h3>${escapeHtml(card.title)}</h3>
        <p>${escapeHtml(card.desc)}</p>
        <div class="login-info">
            <div class="account-row">
                <span>${escapeHtml(card.accountLabel)}：<strong data-full="${escapeHtml(card.accountFull)}">${escapeHtml(card.accountMasked)}</strong></span>
                <button type="button" onclick="copyCardField('${card.id}','account')" title="複製帳號">📋 複製</button>
            </div>
            <div class="account-row">
                <span>${escapeHtml(card.passwordLabel)}：<strong data-full="${escapeHtml(card.passwordFull)}">${escapeHtml(card.passwordMasked)}</strong></span>
                <button type="button" onclick="copyCardField('${card.id}','password')" title="複製密碼">📋 複製</button>
            </div>
            <a href="${escapeHtml(card.url)}" target="_blank" rel="noopener noreferrer" class="emy-btn">${escapeHtml(card.btnLabel)}</a>
        </div>
    `;
}
function renderEmyCard(card) {
    return `
        <div class="card-header">
            <div class="icon">${card.icon || '📅'}</div>
            <div class="card-actions">
                <button class="action-btn" onclick="editCard('${card.id}')" title="編輯">✏️</button>
                <button class="action-btn" onclick="deleteCard('${card.id}')" title="刪除">🗑️</button>
            </div>
        </div>
        <h3>${escapeHtml(card.title)}</h3>
        <p>${escapeHtml(card.desc)}</p>
        <div class="login-info">
            <div>
                <label for="doctorID-${card.id}">👨‍⚕️ 醫師代號</label>
                <input type="text" id="doctorID-${card.id}" placeholder="例如：MA0001" oninput="updateEmyWay('${card.id}')">
            </div>
            <div class="account-row">
                <span>帳號：<strong id="emyAccount-${card.id}">—</strong></span>
                <button type="button" onclick="copyEmyAccount('${card.id}')" title="複製帳號">📋 複製</button>
            </div>
            <div class="account-row">
                <span>密碼：<strong id="emyPassword-${card.id}">—</strong></span>
                <button type="button" onclick="copyEmyPassword('${card.id}')" title="複製密碼">📋 複製</button>
            </div>
            <a id="emyLogin-${card.id}" href="${escapeHtml(card.baseUrl)}" target="_blank" rel="noopener noreferrer" class="emy-btn">🚀 開啟 EmyWay</a>
        </div>
    `;
}
function renderWorkspaceCard(card) {
    return `
        <div class="card-header">
            <div class="icon">${card.icon || '📝'}</div>
            <div class="card-actions">
                <button class="action-btn" onclick="deleteCard('${card.id}')" title="刪除">🗑️</button>
            </div>
        </div>
        <h3>${escapeHtml(card.title)}</h3>
        <p class="ws-intro">${escapeHtml(card.desc)}</p>
        <div class="ws-field">
            <label for="wsFilename">📁 檔案名稱</label>
            <input type="text" id="wsFilename" placeholder="例如：Aortic_Dissection_20260829.html">
        </div>
        <div class="ws-field">
            <label for="wsContent">📄 內容</label>
            <textarea id="wsContent" placeholder="在這裡輸入或貼上內容……"></textarea>
        </div>
        <div class="ws-buttons">
            <button type="button" class="ws-save" onclick="wsSaveRecord()">💾 儲存紀錄</button>
            <button type="button" class="ws-clear" onclick="wsClearForm()">🧹 清除</button>
        </div>
        <div class="ws-field ws-search-row">
            <label for="wsSearch">🔍 搜尋紀錄</label>
            <input type="text" id="wsSearch" placeholder="搜尋檔案名稱或內容……">
        </div>
        <div id="wsRecords" class="ws-records"></div>
    `;
}
/* ==========================================================
   Drag & Drop — unchanged framework from A, applies to
   every card type (link / login / emy / workspace alike)
========================================================== */
let draggedIndex = null;
function handleDragStart(e) {
    draggedIndex = +this.dataset.index;
    this.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
}
function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
}
function handleDrop(e) {
    e.preventDefault();
    const targetIndex = +this.dataset.index;
    if (draggedIndex === null || draggedIndex === targetIndex) return;
    const draggedItem = cards.splice(draggedIndex, 1)[0];
    cards.splice(targetIndex, 0, draggedItem);
    saveCards();
    renderCards();
}
function handleDragEnd() {
    this.classList.remove("dragging");
    draggedIndex = null;
}
/* ==========================================================
   In-place editing — extended from A to cover every type
========================================================== */
function editCard(id) {
    const card = cards.find(c => c.id === id);
    if (!card) return;
    const newTitle = prompt("修改名稱：", card.title);
    if (newTitle === null) return;
    const newDesc = prompt("修改描述：", card.desc);
    if (newDesc === null) return;
    card.title = newTitle.trim() || card.title;
    card.desc = newDesc.trim() || card.desc;
    if (card.type === "link") {
        const newUrl = prompt("修改網址 (URL)：", card.url);
        if (newUrl === null) return;
        const newMeta = prompt("修改標籤：", card.meta);
        if (newMeta === null) return;
        card.url = newUrl.trim() || card.url;
        card.meta = newMeta.trim() || card.meta;
    } else if (card.type === "login") {
        const newUrl = prompt("修改開啟網址 (URL)：", card.url);
        if (newUrl !== null) card.url = newUrl.trim() || card.url;
        const newAccount = prompt("修改帳號：", card.accountFull);
        if (newAccount !== null && newAccount.trim()) {
            card.accountFull = newAccount.trim();
            card.accountMasked = maskValue(card.accountFull);
        }
        const newPassword = prompt("修改密碼：", card.passwordFull);
        if (newPassword !== null && newPassword.trim()) {
            card.passwordFull = newPassword.trim();
            card.passwordMasked = maskValue(card.passwordFull);
        }
    }
    saveCards();
    renderCards();
}
function maskValue(str) {
    if (!str || str.length <= 6) return str;
    return str.slice(0, 3) + "••••" + str.slice(-3);
}
function addNewCard() {
    const title = prompt("卡片名稱：", "新醫用連結");
    if (!title) return;
    const url = prompt("網址 (URL)：", "https://");
    if (!url) return;
    const desc = prompt("描述：", "");
    const meta = prompt("標籤：", "醫療");
    const newCard = {
        id: Date.now().toString(),
        type: "link",
        title: title.trim(),
        url: url.trim(),
        desc: desc ? desc.trim() : "",
        meta: meta ? meta.trim() : "醫療",
        icon: "💊"
    };
    cards.unshift(newCard);
    saveCards();
    renderCards();
}
function deleteCard(id) {
    if (!confirm("確定要刪除這張卡片嗎？")) return;
    cards = cards.filter(c => c.id !== id);
    saveCards();
    renderCards();
}
function resetDefaultCards() {
    if (confirm("恢復預設我的醫院醫用卡片嗎？")) {
        cards = JSON.parse(JSON.stringify(defaultCards));
        saveCards();
        renderCards();
    }
}
function filterCards() {
    const query = document.getElementById("search").value.toLowerCase();
    document.querySelectorAll("#cardGrid > .card").forEach(el => {
        const text = el.innerText.toLowerCase();
        el.style.display = text.includes(query) ? "flex" : "none";
    });
}
function escapeHtml(str) {
    return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
/* ==========================================================
   Login-card copy buttons (Hinet / CGU Mail / UpToDate)
========================================================== */
function copyCardField(id, field) {
    const card = cards.find(c => c.id === id);
    if (!card) return;
    const value = field === "account" ? card.accountFull : card.passwordFull;
    const label = field === "account" ? card.accountLabel : card.passwordLabel;
    if (!value) { alert("⚠️ 尚未設定" + label + "，請先點擊 ✏️ 編輯輸入。"); return; }
    navigator.clipboard.writeText(value);
    alert("✅ " + label + "已複製：" + value);
}
/* ==========================================================
   EmyWay — 帳號 = 醫師代號，密碼 = 醫師代號轉大寫
   (kept per-card so multiple EmyWay cards could coexist)
========================================================== */
function updateEmyWay(id) {
    const input = document.getElementById("doctorID-" + id).value.trim();
    const doctorID = input.toUpperCase();
    document.getElementById("emyAccount-" + id).textContent = doctorID || "—";
    document.getElementById("emyPassword-" + id).textContent = doctorID || "—";
}
function copyEmyAccount(id) {
    const account = document.getElementById("emyAccount-" + id).textContent;
    if (account === "—") { alert("請先輸入醫師代號！"); return; }
    navigator.clipboard.writeText(account);
    alert("✅ 帳號已複製：" + account);
}
function copyEmyPassword(id) {
    const password = document.getElementById("emyPassword-" + id).textContent;
    if (password === "—") { alert("請先輸入醫師代號！"); return; }
    navigator.clipboard.writeText(password);
    alert("✅ 密碼已複製：" + password);
}
/* ==========================================================
   WebSpace — Google Sheet (Apps Script Web App) 雲端紀錄
   (identical endpoint/logic to HTML B, now embedded as a
   card inside A's grid)
========================================================== */
let wsRecordsCache = [];
let wsLoading = false;
async function wsFetchRecords() {
    const res = await fetch(WS_API_URL + "?action=list");
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "讀取失敗");
    return data.records;
}
async function wsPostAdd(filename, content) {
    const res = await fetch(WS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "add", filename, content })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "新增失敗");
    return data.record;
}
async function wsPostDelete(id) {
    const res = await fetch(WS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "delete", id })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "刪除失敗");
}
async function wsSaveRecord() {
    const filenameEl = document.getElementById("wsFilename");
    const contentEl = document.getElementById("wsContent");
    if (!filenameEl || !contentEl) return;
    const filename = filenameEl.value.trim();
    const content = contentEl.value.trim();
    if (!filename) { alert("請輸入檔案名稱！"); return; }
    if (!content) { alert("請輸入內容！"); return; }
    const btn = document.querySelector(".ws-save");
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "💾 儲存中…";
    try {
        await wsPostAdd(filename, content);
        wsClearForm();
        await wsDisplayRecords();
    } catch (err) {
        alert("⚠️ 儲存失敗：" + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = originalText;
    }
}
function wsClearForm() {
    const filenameEl = document.getElementById("wsFilename");
    const contentEl = document.getElementById("wsContent");
    if (filenameEl) filenameEl.value = "";
    if (contentEl) contentEl.value = "";
}
async function wsDeleteRecord(id) {
    if (!confirm("確定要刪除這筆紀錄嗎？")) return;
    try {
        await wsPostDelete(id);
        await wsDisplayRecords();
    } catch (err) {
        alert("⚠️ 刪除失敗：" + err.message);
    }
}
function wsEscapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
async function wsDisplayRecords() {
    const container = document.getElementById("wsRecords");
    if (!container) return;
    if (wsLoading) return;
    wsLoading = true;
    container.innerHTML = '<div class="ws-empty">⏳ 讀取中…</div>';
    try {
        wsRecordsCache = await wsFetchRecords();
    } catch (err) {
        container.innerHTML = '<div class="ws-empty">⚠️ 無法連線至 Google Sheet：' + wsEscapeHTML(err.message) + '</div>';
        wsLoading = false;
        return;
    }
    wsLoading = false;
    wsRenderRecords();
}
function wsRenderRecords() {
    const container = document.getElementById("wsRecords");
    const searchEl = document.getElementById("wsSearch");
    if (!container || !searchEl) return;
    const search = searchEl.value.trim().toLowerCase();
    const filtered = wsRecordsCache.filter(r =>
        r.filename.toLowerCase().includes(search) ||
        r.content.toLowerCase().includes(search)
    );
    if (filtered.length === 0) {
        container.innerHTML = '<div class="ws-empty">📭 目前沒有紀錄</div>';
        return;
    }
    container.innerHTML = filtered.map(r => `
        <div class="ws-record">
            <div class="ws-record-header">
                <div>
                    <div class="ws-filename">📁 ${wsEscapeHTML(r.filename)}</div>
                    <div class="ws-date">${wsEscapeHTML(r.date)}</div>
                </div>
                <button type="button" class="ws-delete" onclick="wsDeleteRecord('${r.id}')">🗑 刪除</button>
            </div>
            <div class="ws-record-content">${wsEscapeHTML(r.content)}</div>
        </div>
    `).join("");
}
// Initial Render
renderCards();
</script>
